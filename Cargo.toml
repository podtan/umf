[package]
name = "umf"
version = "0.2.2"
edition = "2021"
authors = ["Simpaticoder Contributors"]
description = "Universal Message Format (UMF) - Provider-agnostic message representation for LLM interactions with ChatML formatting, internal hub model, and MCP support"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/podtan/umf"
homepage = "https://umf.podtan.com"
documentation = "https://docs.rs/umf"
keywords = ["llm", "message-format", "openai", "anthropic", "mcp"]
categories = ["data-structures", "encoding"]
rust-version = "1.70"

[workspace]
# This is a standalone crate, not part of a workspace

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiktoken-rs = "0.5"
futures-util = { version = "0.3", optional = true }
thiserror = { version = "1.0", optional = true }

[features]
default = ["internal"]
internal = ["thiserror"]
chatml = ["internal"]
events = ["internal"]
streaming = ["internal", "futures-util"]
mcp = ["internal"]
full = ["internal", "chatml", "events", "streaming", "mcp"]

[dev-dependencies]
# No additional dev dependencies needed for now
